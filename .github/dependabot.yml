# Weekly version updates; security updates are on in the repository settings and come separately.
# Minor and patch updates are grouped into one pull request per ecosystem, majors come one by one.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # gpui-kit pins a weekly GPUI snapshot; it is updated deliberately (see Cargo.toml)
      - dependency-name: gpui-kit

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
