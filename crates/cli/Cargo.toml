[package]
name = "nc-cli"
description = "neuro-convert command line: inspect recordings and convert them to NWB"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "neuro-convert"
path = "src/main.rs"

[features]
default = ["tdt", "spikeglx", "intan", "openephys"]
tdt = ["nc-convert/tdt"]
spikeglx = ["nc-convert/spikeglx"]
intan = ["nc-convert/intan"]
openephys = ["nc-convert/openephys"]

[dependencies]
nc-convert = { workspace = true, features = ["nwb"] }
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
serde_json.workspace = true
