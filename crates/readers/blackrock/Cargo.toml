[package]
name = "nc-blackrock"
description = "neuro-convert reader for Blackrock Microsystems recordings (NSx continuous files, NEV spikes and events; file spec 2.1 – 3.0 incl. PTP)"
# This crate's own version: bump it when its behaviour or API changes (see CHANGELOG.md)
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
nc-base.workspace = true
nc-core.workspace = true

[dev-dependencies]
nc-core = { workspace = true, features = ["testkit"] }
