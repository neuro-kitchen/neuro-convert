# Template for a new reader: copy this folder to crates/readers/<format>/ and rename
# `nc-template` / `Template` (see docs/readers/README.md). It is not built where it is.
[package]
name = "nc-template"
description = "neuro-convert reader for <format> recordings"
# This crate's own version: bump it when its behaviour or API changes (see CHANGELOG.md)
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
nc-base.workspace = true
nc-core.workspace = true

[dev-dependencies]
nc-core = { workspace = true, features = ["testkit"] }
